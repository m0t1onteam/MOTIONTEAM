<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ну, погоди! Математика</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Courier New', monospace;
    overflow-y: auto;
    padding: 20px 0 80px 0;
    user-select: none;
  }
  #game {
    background: #9bbc0f;
    border: 8px solid #306230;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(155,188,15,0.5);
    position: relative;
    margin-bottom: 85px;
  }
  canvas { display: block; }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #0f380f;
    font-weight: bold;
    font-size: 13px;
    pointer-events: none;
  }
  #ui .item { display: flex; align-items: center; gap: 4px; }
  #timer.urgent { color: #8b0000; animation: pulse 0.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  #target {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f380f;
    color: #9bbc0f;
    padding: 5px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    border: 3px solid #306230;
    white-space: nowrap;
  }

  #message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    color: #0f380f;
    text-shadow: 2px 2px 0 #9bbc0f, -2px -2px 0 #9bbc0f;
    display: none;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,56,15,0.95);
    color: #9bbc0f;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    gap: 10px;
    padding: 16px;
    text-align: center;
    z-index: 10;
    overflow-y: auto;
  }
  .overlay h1 { font-size: 24px; margin-bottom: 4px; }
  .overlay button {
    background: #9bbc0f;
    color: #0f380f;
    border: none;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    margin: 3px;
  }
  .overlay button:hover { background: #8aad0d; }
  .overlay button.secondary {
    background: transparent;
    color: #9bbc0f;
    border: 2px solid #9bbc0f;
    padding: 8px 18px;
    font-size: 13px;
  }
  .stats {
    background: rgba(155,188,15,0.1);
    border: 2px solid #9bbc0f;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    min-width: 240px;
    max-width: 340px;
  }
  .stats b { color: #c8e04a; }

  .records-scroll {
    max-height: 170px;
    overflow-y: auto;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px;
  }
  .records-scroll::-webkit-scrollbar { width: 6px; }
  .records-scroll::-webkit-scrollbar-thumb { background: #9bbc0f; border-radius: 3px; }

  .records-block {
    background: rgba(155,188,15,0.08);
    border: 2px solid #9bbc0f;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
  }
  .records-title {
    font-weight: bold;
    font-size: 12px;
    text-align: center;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(155,188,15,0.3);
    color: #c8e04a;
  }
  .record-row {
    display: grid;
    grid-template-columns: 22px 38px 1fr auto;
    gap: 5px;
    align-items: center;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(155,188,15,0.15);
  }
  .record-row:last-child { border-bottom: none; }
  .medal { font-size: 13px; text-align: center; }
  .score-val { font-weight: bold; color: #c8e04a; }
  .rec-info { font-size: 9px; opacity: 0.85; }
  .rec-date { font-size: 9px; opacity: 0.6; }

  .new-record {
    background: linear-gradient(90deg, #9bbc0f, #c8e04a);
    color: #0f380f;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
    animation: recordPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes recordPulse {
    from { transform: scale(1); box-shadow: 0 0 0 rgba(200,224,74,0.8); }
    to   { transform: scale(1.03); box-shadow: 0 0 20px rgba(200,224,74,0.6); }
  }

  #controls {
    position: absolute;
    bottom: -75px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
  }
  #controls button {
    background: #306230;
    color: #9bbc0f;
    border: none;
    width: 65px; height: 65px;
    font-size: 26px;
    border-radius: 50%;
    font-family: inherit;
    cursor: pointer;
    user-select: none;
  }
  #controls button:active { background: #0f380f; }

  @media (max-width: 450px) {
    #game { border-width: 5px; }
    #controls button { width: 55px; height: 55px; font-size: 22px; }
    .overlay h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas" width="400" height="600"></canvas>

  <div id="ui">
    <span class="item">❤️ <span id="lives">3</span></span>
    <span class="item" id="timerWrap" style="display:none;">⏱ <span id="timer">60</span></span>
    <span class="item">Ур. <span id="level">1</span></span>
    <span class="item">⭐ <span id="score">0</span></span>
  </div>

  <div id="target">ЦЕЛЬ: <span id="targetVal">10</span></div>
  <div id="message"></div>

  <div class="overlay" id="menu" style="display:flex;">
    <h1>🐺 НУ, ПОГОДИ! 🐰</h1>
    <div style="font-size:13px; opacity:0.8;">Математическая аркада</div>
    <div>
      <button onclick="startGame('classic')">🎮 Классика</button>
      <button onclick="startGame('blitz')">⚡ Блиц 60 сек</button>
    </div>
    <div class="records-scroll" id="menuRecords"></div>
    <div style="font-size:11px; opacity:0.7;">
      ← → или A/D или свайп
    </div>
  </div>

  <div class="overlay" id="gameover">
    <h1 id="goTitle">🐺 НУ, ПОГОДИ!</h1>
    <div id="goSub">Игра окончена</div>
    <div class="stats" id="stats"></div>
    <div class="records-scroll" id="recordsContainer"></div>
    <div>
      <
